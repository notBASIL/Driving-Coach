name: Update road speed-limit data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 1 * *"   # monthly
  push:
    paths:
      - "tools/build_roads.py"
      - "tools/area.json"

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download OpenStreetMap roads and build tiles
        run: python3 tools/build_roads.py
      - name: Commit updated tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roads
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update road speed-limit data"
          git push
      - name: Republish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
